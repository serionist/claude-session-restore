# The secret scan's config (gitleaks 8.30.1): gitleaks' own rules. `node tools/gate.ts quick` scans the branch's
# commits with it, and the pre-push hook runs that lane. A finding is rotated and taken out of the commits, or allowed
# here with its reason. The scan ignores gitleaks:allow comments and the gate refuses a .gitleaksignore, so every
# exception lives in this file.
title = "claude-session-restore"

[extend]
useDefault = true

# An exception, when one is needed: an allowlist on the rule that fired, scoped to the paths it covers and saying
# why the text is no secret, so the same text in any other file still fails. Never a global [allowlist].
#
# [[rules]]
# id = "generic-api-key"
#
# [[rules.allowlists]]
# description = "Why this is no secret"
# paths = ['''^tools/example\.test\.ts$''']
